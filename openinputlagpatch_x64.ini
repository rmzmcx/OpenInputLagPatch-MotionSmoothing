; OpenInputLagPatch x64 默认配置 / Default configuration
;
; 全局配置 / Global config: %APPDATA%\ShanghaiAlice\oilp_custom\openinputlagpatch_x64.ini
;
; 游戏目录中存在同名文件时，会覆盖其中出现的同名项目。
; A file with the same name in the game directory overrides the keys it contains.

[Option]

; 游戏逻辑目标帧率，最低 60。
; 检测到官方 thprac 时，优先跟随 thprac 的帧率设置。
;
; Target game logic frame rate, minimum 60.
; When official thprac is loaded, its frame rate setting takes priority.
;
; 默认 / Default: 60
GameFPS = 60

; 创建交换链时请求 DXGI_SWAP_EFFECT_FLIP_DISCARD。
; 创建失败时会回退到游戏原交换链描述。
;
; Request DXGI_SWAP_EFFECT_FLIP_DISCARD when creating the swap chain.
; Falls back to the game's original swap-chain description if creation fails.
;
; 默认 / Default: 1
ForceFlipDiscard = 1

; 允许无同步 Present，避免前台窗口的 flip 队列等待合成刷新。
; 可让补帧提交率超过显示器刷新率，但可能产生画面撕裂。
; 仅在 ForceFlipDiscard = 1 时请求；不受支持时自动回退。
;
; Allow unsynchronised presentation so foreground flip-queue waits can be avoided.
; This can raise the presentation rate above the display refresh rate, with possible tearing.
; Only requested when ForceFlipDiscard = 1; unsupported systems fall back automatically.
;
; 默认 / Default: 1
AllowTearing = 1

; 是否控制 Replay 播放速度。
; 使用游戏自身输入合成结果中的低速键，支持游戏内改键。
;
; Whether to control Replay playback speed.
; Uses the low-speed action from the game's composed input and supports remapped keys.
;
; 默认 / Default: 1
ReplaySpeedControl = 1

; Replay 慢放倍率，必须大于 0 且小于 1。
; 例如 0.5 表示半速。
;
; Replay slowdown multiplier, greater than 0 and less than 1.
; For example, 0.5 is half speed.
;
; 默认 / Default: 0.5
ReplaySlowRate = 0.5

; Replay 加速倍率，按住游戏配置的射击键时触发。
; 允许范围：1 到 128；1 表示不增加逻辑更新。
;
; Replay fast-forward multiplier while holding the game's configured shoot key.
; Allowed range: 1 to 128. A value of 1 adds no extra logic updates.
;
; 默认 / Default: 8
ReplayFastRate = 8

; overlay 显示内容：
; 0 = 关闭
; 1 = 实际 Present 帧率
; 2 = 帧处理耗时
; 3 = 同时显示帧率和耗时
;
; Overlay contents:
; 0 = off
; 1 = actual Present rate
; 2 = frame processing time
; 3 = both rate and processing time
;
; 默认 / Default: 1
ShowOverlay = 1

; 是否创建调试控制台，显示版本识别、Hook 和交换链信息。
;
; Whether to create a debug console showing version detection, hooks and swap-chain information.
; 0 = off, 1 = on.
;
; 默认 / Default: 0
DebugConsole = 0

[Interpolation]

; 补帧目标呈现率，格式与 x86 版本一致：
; 0 = 关闭
; 1 = 按显示器刷新率
; -1 = 显示器刷新率内游戏帧率的最大整数倍
; N = 每个游戏逻辑帧呈现 N 次
; *R = 固定每秒呈现 R 次，例如 *240
;
; Frame interpolation presentation target, using the same formats as the x86 build:
; 0 = off
; 1 = display refresh rate
; -1 = largest whole multiple of the game frame rate within the display refresh rate
; N = N presentations per game logic frame
; *R = fixed presentation rate R per second, such as *240
; 注意：超过显示器刷新率的提交可能改善延迟或撕裂表现，
; 但显示器每秒实际扫描出的唯一画面数仍受刷新率限制。
;
; Note: presentations above the display refresh rate may improve latency or tearing behaviour,
; but the number of unique frames physically scanned out per second is still limited by the display.
;
; 默认 / Default: 0
Interpolation = 0

; 是否对敌弹进行对象级前向预测。
; 当前第一阶段只处理状态 1 的普通飞行敌弹。
;
; Whether to extrapolate enemy bullets at object level.
; The first stage currently only handles ordinary flying bullets in state 1.
; 0 = off, 1 = on.
;
; 默认 / Default: 1
EnemyBullets = 1

; 是否对直线激光进行前向预测。
; 使用相邻逻辑帧的位置、角度、起止偏移和宽度变化。
;
; Whether to extrapolate straight lasers.
; Uses measured position, angle, start/end offsets and width changes between logic frames.
; 0 = off, 1 = on.
;
; 默认 / Default: 1
Lasers = 1

; 是否对自机本体和两个 Option 进行前向预测。
; 自机使用当前输入和角色速度表；Option 使用相邻帧实测位移。
;
; Whether to extrapolate the player body and its two options.
; The player uses the current input and character speed table; options use measured per-frame motion.
; 0 = off, 1 = on.
;
; 默认 / Default: 1
PlayerBody = 1

; 是否对自机弹进行前向预测。
; 使用相邻逻辑帧的绘制位置变化，并忽略槽位复用造成的大跳变。
;
; Whether to extrapolate player shots.
; Uses measured draw-position changes between logic frames and ignores large slot-reuse jumps.
; 0 = off, 1 = on.
;
; 默认 / Default: 1
PlayerShots = 1
