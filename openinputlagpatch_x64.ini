; OpenInputLagPatch x64 默认配置
; Global default: %APPDATA%\ShanghaiAlice\oilp_custom\openinputlagpatch_x64.ini
; A copy in the game directory overrides the keys it contains.

[Option]
GameFPS = 60
; Request DXGI_SWAP_EFFECT_FLIP_DISCARD when creating the game swap chain.
ForceFlipDiscard = 1
ReplaySpeedControl = 1
; Replay playback speed while holding LSHIFT. 0.5 = half speed.
ReplaySlowRate = 0.5
; 0 = off, 1 = present FPS, 2 = frame time, 3 = both
ShowOverlay = 1
DebugConsole = 0
